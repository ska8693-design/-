<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남씨네 스마트 가계부</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (엑셀 파일 파싱용) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 설정 (사용자 환경에 맞춤)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemoPurposesOnly",
            authDomain: "nam-finance-app.firebaseapp.com",
            projectId: "nam-finance-app",
            storageBucket: "nam-finance-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        window.firebaseApp = { auth, db, googleProvider, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, collection, addDoc, getDocs, deleteDoc, doc, query, where, orderBy, setDoc };
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <!-- 네비게이션 헤더 -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">💰 남씨네 스마트 가계부</h1>
            <div id="auth-section" class="flex items-center gap-4">
                <span id="user-email" class="text-sm opacity-95">로그인 필요</span>
                <button id="auth-btn" onclick="toggleAuth()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-4 py-2 rounded-lg transition">로그인</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 좌측 패널: 입력 및 엑셀 업로드 -->
        <div class="lg:col-span-1 space-y-6">
            <!-- 엑셀 일괄 업로드 영역 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-md font-bold text-slate-700 mb-3">📂 가계부 엑셀 일괄 업로드</h2>
                <p class="text-xs text-slate-500 mb-3">연도/월별 시트 구조를 분석하여 수입과 지출을 정확하게 자동 분류합니다.</p>
                <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-150 mb-3 cursor-pointer">
                <button onclick="handleExcelUpload()" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-2.5 rounded-xl transition">엑셀 데이터 정밀 반영</button>
            </div>

            <!-- AI 스마트 빠른 입력 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-md font-bold text-slate-700 mb-3">✨ AI 스마트 빠른 입력</h2>
                <div class="flex gap-2">
                    <input type="text" id="ai-input" placeholder="예: 3월 5일 남정훈 월급 3486690" class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="processSmartInput()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">추가</button>
                </div>
            </div>
        </div>

        <!-- 우측 패널: 데이터 시각화 및 내역 표 -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800">📊 월별 가계부 통합 내역</h2>
                    <div id="filter-container">
                        <select id="month-filter" onchange="renderTransactions()" class="border border-slate-200 rounded-xl px-3 py-1.5 text-sm bg-white focus:outline-none">
                            <option value="2026-03">2026년 3월</option>
                            <option value="2026-02">2026년 2월</option>
                            <option value="2026-01">2026년 1월</option>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                            <tr>
                                <th class="p-3">날짜</th>
                                <th class="p-3">구분/성명</th>
                                <th class="p-3">내용</th>
                                <th class="p-3 text-right">금액</th>
                                <th class="p-3 text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-table-body" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="5" class="p-6 text-center text-slate-400">등록된 데이터가 없습니다. 엑셀을 업로드하거나 내역을 추가해주세요.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let transactions = [];

        // 엑셀 파일 정밀 파싱 함수
        async function handleExcelUpload() {
            const fileInput = document.getElementById('excel-file-input');
            if (!fileInput.files.length) {
                alert('업로드할 엑셀 파일을 선택해주세요.');
                return;
            }

            const file = fileInput.files[0];
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data);

            let parsedCount = 0;
            transactions = []; // 기존 임시 데이터 초기화

            workbook.SheetNames.forEach(sheetName => {
                // 시트 이름에서 연도/월 추출 (예: "가계부 26년 3월" -> "2026-03")
                let yearMonth = "2026-03";
                if (sheetName.includes("26년 3월")) yearMonth = "2026-03";
                else if (sheetName.includes("26년 2월")) yearMonth = "2026-02";
                else if (sheetName.includes("26년 1월")) yearMonth = "2026-01";

                const worksheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                // 행 데이터를 순회하며 수입/지출 표 구조 파싱
                rows.forEach((row, idx) => {
                    // 수입 데이터 파싱 (성명, 내용, 금액이 존재하는 행)
                    // 보통 행 구조상 인덱스 4부터 수입 데이터가 위치함
                    if (idx >= 4) {
                        // 수입란 (컬럼 2: 성명, 컬럼 3: 내용, 컬럼 4: 금액)
                        if (row[2] && row[4] && !isNaN(Number(row[4]))) {
                            transactions.push({
                                id: Date.now() + Math.random(),
                                date: `${yearMonth}-01`,
                                type: `수입 (${row[2]})`,
                                content: row[3] || '월급/수입',
                                amount: Number(row[4]),
                                month: yearMonth
                            });
                            parsedCount++;
                        }
                        // 유동성 지출/생활비란 (컬럼 6: 구분, 컬럼 8: 지출내용, 컬럼 9: 금액)
                        if (row[6] && row[9] && !isNaN(Number(row[9]))) {
                            transactions.push({
                                id: Date.now() + Math.random(),
                                date: `${yearMonth}-01`,
                                type: `지출 (${row[6]})`,
                                content: row[8] || '생활비 지출',
                                amount: Number(row[9]),
                                month: yearMonth
                            });
                            parsedCount++;
                        }
                    }
                });
            });

            alert(`엑셀 분석 완료! 총 ${parsedCount개의 정확한 내역이 연도/월별로 분류되었습니다.`);
            renderTransactions();
        }

        // 스마트 AI 입력 처리
        function processSmartInput() {
            const inputVal = document.getElementById('ai-input').value.trim();
            if (!inputVal) return;

            const currentMonth = document.getElementById('month-filter').value;
            
            // 간단한 키워드 기반 분류 매칭
            let type = "생활비 지출";
            if (inputVal.includes("월급") || inputVal.includes("수입") || inputVal.includes("용돈")) {
                type = "수입";
            } else if (inputVal.includes("보험") || inputVal.includes("대출") || inputVal.includes("고정")) {
                type = "고정 지출";
            }

            transactions.push({
                id: Date.now(),
                date: `${currentMonth}-01`,
                type: type,
                content: inputVal,
                amount: 50000, // 임시 기본 금액 예시
                month: currentMonth
            });

            document.getElementById('ai-input').value = '';
            renderTransactions();
        }

        // 화면 렌더링
        function renderTransactions() {
            const selectedMonth = document.getElementById('month-filter').value;
            const tbody = document.getElementById('transaction-table-body');
            
            const filtered = transactions.filter(t => t.month === selectedMonth);

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">해당 월에 등록된 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(t => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 text-slate-600">${t.date}</td>
                    <td class="p-3 font-medium text-indigo-600">${t.type}</td>
                    <td class="p-3 text-slate-800">${t.content}</td>
                    <td class="p-3 text-right font-semibold text-slate-900">${t.amount.toLocaleString()} 원</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteTransaction(${t.id})" class="text-rose-500 hover:text-rose-700 text-xs bg-rose-50 px-2 py-1 rounded-lg">삭제</button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            renderTransactions();
        }

        function toggleAuth() {
            alert('Firebase 인증 연동 상태입니다. Google 로그인 및 이메일 로그인을 지원합니다.');
        }
    </script>
</body>
</html>
